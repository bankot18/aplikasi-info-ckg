<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICEKAS v2.0 - Sign in | Puskesmas Banjaran Kota</title>
  <script>
    // AUTO FORWARD: Jika sudah login, otomatis masuk ke dashboard
    (function() {
      try {
        var u = localStorage.getItem('SICEKAS_CURRENT_USER');
        if (u) {
          var p = JSON.parse(u);
          if (p && (p.username || p.nip)) { window.location.replace('dashboard.html'); }
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body class="runaway-app-body">

  <!-- Ambient Dynamic Background Lighting -->
  <div class="ambient-mesh-glow">
    <div class="mesh-orb orb-teal"></div>
    <div class="mesh-orb orb-gold"></div>
    <div class="mesh-orb orb-purple"></div>
    <div class="mesh-grid-pattern"></div>
  </div>

  <!-- Simulated Window Frame -->
  <div class="mac-window-frame" id="macWindow">
    
    <!-- Window Gloss Border Highlight -->
    <div class="mac-window-highlight"></div>

    <!-- Window Titlebar with 3 Control Dots -->
    <div class="mac-titlebar">
      <div class="mac-controls">
        <span class="mac-dot red"></span>
        <span class="mac-dot yellow"></span>
        <span class="mac-dot green"></span>
      </div>
    </div>

    <!-- Window Main Content Area -->
    <div class="mac-window-content">

      <!-- SICEKAS Official Centered Branding Block -->
      <div class="sicekas-brand-centered">
        
        <!-- Centered Logo with Golden Backlight -->
        <div class="logo-aura-box-centered">
          <div class="logo-backlight"></div>
          <img src="LOGO.png" alt="Logo Puskesmas Banjaran Kota" class="sicekas-logo-centered" id="appLogo">
          <div class="logo-shine-glare"></div>
        </div>

        <!-- Centered Brand Titles -->
        <div class="brand-title-group-centered">
          <div class="brand-title-row-centered">
            <h1 class="brand-name-centered">SICEKAS</h1>
            <span class="brand-badge-v2">v2.0</span>
          </div>
          <p class="brand-subtitle-1">Sistem Informasi Catat Pelaporan Puskesmas</p>
          <div class="brand-subtitle-2">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>Puskesmas Banjaran Kota</span>
          </div>
        </div>

      </div>

      <!-- Main Runaway Card -->
      <div class="runaway-main-card">
        <div class="card-inner-glow"></div>

        <div class="card-heading-group">
          <h2 class="card-title-text">Selamat Datang</h2>
          <p class="card-subtitle-text" id="cardSubtitleText">Silakan masukkan kredensial akun pegawai Anda</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="runaway-form" autocomplete="off" onsubmit="event.preventDefault();">
          
          <!-- Field 1: Searchable Officer Dropdown -->
          <div class="form-field-wrapper" id="fieldWrapperUser" style="position: relative;">
            <div class="field-label-row">
              <label for="username" class="field-label">Akun Pegawai Puskesmas</label>
              <span class="field-status-txt" id="fieldUserStatus">Pilih / cari nama pegawai</span>
            </div>
            
            <div class="field-input-box" id="boxUser">
              <div class="field-icon-left">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              
              <input 
                type="text" 
                id="username" 
                class="field-input" 
                placeholder="Cari nama, NIP, atau jabatan pegawai..." 
                autocomplete="off"
                required
              >

              <div class="field-right-actions">
                <button type="button" class="btn-dropdown-trigger" id="btnTriggerUserDropdown" title="Buka daftar 39 pegawai">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <div class="field-badge-valid" id="badgeValidUser">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
              </div>
            </div>

            <!-- SEARCHABLE OFFICER DROPDOWN POPUP -->
            <div class="user-search-dropdown" id="userDropdownList" style="display: none;">
              <div class="dropdown-header-bar">
                <span class="dropdown-header-txt">Pilih Pegawai Puskesmas Banjaran Kota:</span>
                <span class="dropdown-count-txt" id="dropdownResultCount">39 Pegawai</span>
              </div>
              <div class="dropdown-items-scroll" id="dropdownItemsList">
                <!-- Dynamically populated 39 officers -->
              </div>
            </div>
          </div>

          <!-- Field 2: Password -->
          <div class="form-field-wrapper" id="fieldWrapperPass">
            <div class="field-label-row">
              <label for="password" class="field-label">Kata Sandi</label>
              <a href="javascript:void(0)" class="field-forgot-link" id="btnForgotPass">Lupa Sandi?</a>
            </div>
            
            <div class="field-input-box" id="boxPass">
              <div class="field-icon-left">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              
              <input 
                type="password" 
                id="password" 
                class="field-input" 
                placeholder="Masukkan kata sandi..." 
                autocomplete="current-password"
                required
              >

              <div class="field-right-actions">
                <button type="button" class="btn-toggle-eye" id="togglePassword" title="Lihat/Sembunyikan sandi">
                  <svg id="eyeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
                <div class="field-badge-valid" id="badgeValidPass">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- THE DOCK TRACK (Runaway Button Track) -->
          <div class="dock-track-container" id="dockContainer">
            
            <!-- Rubber Elastic Band SVG -->
            <svg class="dock-rubber-band" id="dockBandSvg">
              <defs>
                <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#2dd4bf" />
                  <stop offset="100%" stop-color="#ffd166" />
                </linearGradient>
              </defs>
              <line id="bandLine" x1="50%" y1="50%" x2="50%" y2="50%" stroke="url(#bandGrad)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0"></line>
            </svg>

            <!-- Target Center Socket Slot (Dashed outline in center) -->
            <div class="dock-target-socket" id="dockSocket">
              <span class="socket-inner-dash"></span>
              <span class="socket-glow-aura"></span>
            </div>

            <!-- The Runaway CTA Button -->
            <button 
              type="submit" 
              class="dock-cta-btn" 
              id="btnSignIn"
              tabindex="0"
            >
              <span class="cta-inner" id="ctaInner">
                <span class="cta-text" id="ctaText">Log in</span>
                <span class="cta-spinner" id="ctaSpinner" style="display: none;"></span>
                <svg class="cta-check-icon" id="ctaCheck" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" style="display: none;">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              <span class="cta-sweep-glow"></span>
            </button>
          </div>

          <!-- Dynamic Status Bullet & Text -->
          <div class="dynamic-status-row">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label" id="statusLabel">Lengkapi username dan sandi untuk membuka tombol.</span>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="script.js?v=20"></script>
</body>
</html>
