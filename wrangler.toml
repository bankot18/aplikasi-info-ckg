# ============================================================================
# SICEKAS v2.0 - CLOUDFLARE PAGES & D1 DATABASE CONFIGURATION
# ============================================================================

name = "sicekas-v2"
compatibility_date = "2026-08-01"
main = "functions/api/[[route]].js"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sicekas-v2"
database_id = "8186f6c9-f454-4a87-a541-50d09e74b929"

[vars]
ENVIRONMENT = "production"
APP_NAME = "SICEKAS v2.0"
PUSKESMAS_NAME = "Puskesmas Banjaran Kota"
